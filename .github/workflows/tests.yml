name: Tests and container smoke
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m unittest -v
      - run: docker build -t reviewer-smoke .
      - name: Verify container output
        run: |
          docker run --rm reviewer-smoke > benchmark-output.json
          python -c 'import json; r=json.load(open("benchmark-output.json")); assert [r[k]["exact_citations"] for k in ("fixed", "adaptive", "guarded_adaptive")] == [10, 9, 10]'
